<button type="button" class="button fav-button" aria-pressed="{{ 'true' if entry.favorite else 'false' }}"
        hx-post="/d/{{ entry.id }}/favorite" hx-swap="outerHTML">
  <span class="pin" aria-hidden="true"></span>
  {% if entry.favorite %}Favorited{% else %}Add to favorites{% endif %}
</button>
